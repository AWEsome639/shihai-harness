schema_version = "1.3"
artifacts = ["/app/files", "/logs/agent"]

[task]
name = "ple/landscape-sheet-revision"
description = "Street-tree revision worked into a landscape resubmittal"
keywords = ["Civil engineering"]

[metadata]
domain = "Civil engineering"
grading = "rubric"
verifier_image = "task"

[verifier]
environment_mode = "separate"
network_mode = "public"
timeout_sec = 1800.0

[verifier.env]
JUDGE_BASE_URL = "${JUDGE_BASE_URL:-}"
JUDGE_API_KEY = "${JUDGE_API_KEY:-}"
JUDGE_MODEL = "${JUDGE_MODEL:-claude-opus-5-5}"

[verifier.environment]
network_mode = "public"
cpus = 2
memory_mb = 4096
build_timeout_sec = 600.0

[agent]
network_mode = "public"
timeout_sec = 21600

[environment]
network_mode = "public"
build_timeout_sec = 600.0
os = "linux"
cpus = 2
memory_mb = 4096
storage_mb = 10240
